[package]
name = "yaplay"
version = "0.1.0"
edition = "2024"

[dependencies]
freya = { version = "0.4.3", features = ["sdk-tokio"] }
display-info = "0.5"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tungstenite = "0.26"
futures-util = "0.3"
async-io = "2"
global-hotkey = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
