name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          base: master
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'scripts/publish-release*'
              - 'assets/branding/**'
              - '.github/workflows/checks.yml'
              - '.github/workflows/build.yml'

  quality:
    name: Formatting, wrapper tests, and workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix .github/release
      - run: npm test --prefix .github/release
      - run: node .github/release/check-changelog.mjs
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha || 'origin/master' }}
      - run: node --test examples/yaplay-client.test.mjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  rust:
    name: Rust lint and tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Both installer backends must compile before a desktop release.
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  required:
    name: Required checks
    if: ${{ !cancelled() }}
    needs: [changes, quality, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          RUST: ${{ needs.rust.result }}
        run: |
          [[ "$CHANGES" == success && "$QUALITY" == success ]]
          [[ "$RUST" == success || "$RUST" == skipped ]]
