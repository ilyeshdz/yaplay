name: Website
on:
  push:
    branches: [main, master]
    paths: ['site/**', 'examples/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['site/**', 'examples/**', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: node --test examples/yaplay-client.test.mjs
      - run: npm ci
        working-directory: site
      - name: Configure project path
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          base="${PAGES_BASE_PATH:-/$name}"
          if [[ "$name" == *.github.io || "$base" == / ]]; then base=""; fi
          echo "NEXT_PUBLIC_BASE_PATH=$base" >> "$GITHUB_ENV"
      - run: npm run build
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: node scripts/check-export.mjs
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
