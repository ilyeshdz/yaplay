name: Release Please

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      - run: npm ci --prefix .github/release
      # GITHUB_TOKEN changes do not emit workflow events; dispatch checks and builds explicitly.
      - run: node .github/release/release-please.mjs
        env:
          GH_TOKEN: ${{ github.token }}
