name: Release assets

on:
  workflow_call:
    secrets:
      UPDATER_SIGNING_KEY:
        description: Minisign secret key contents for release packages
        required: true
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify existing release
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify updater signing configuration
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.YAPLAY_UPDATE_PUBLIC_KEY }}
          UPDATE_SECRET_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_PUBLIC_KEY" || { echo "Set YAPLAY_UPDATE_PUBLIC_KEY repository variable"; exit 1; }
          test -n "$UPDATE_SECRET_KEY" || { echo "Set UPDATER_SIGNING_KEY repository secret"; exit 1; }
      - name: Resolve the release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vMAJOR.MINOR.PATCH"; exit 1; }
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: yaplay.exe
            output: yaplay-windows-x86_64.exe
            artifact: yaplay-windows-x86_64
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            binary: yaplay
            artifact: yaplay-macos-aarch64

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Verify package version matches the release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          [[ "v$VERSION" == "$RELEASE_TAG" ]] || { echo "Cargo version does not match release tag"; exit 1; }

      - name: Build release binary
        env:
          YAPLAY_UPDATE_PUBLIC_KEY: ${{ vars.YAPLAY_UPDATE_PUBLIC_KEY }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.output }}"

      - name: Package macOS app and DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)

          APP="dist/Yaplay.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/yaplay" "$APP/Contents/MacOS/yaplay"
          chmod +x "$APP/Contents/MacOS/yaplay"
          cp assets/branding/icon.icns "$APP/Contents/Resources/Yaplay.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>yaplay</string>
            <key>CFBundleIdentifier</key>
            <string>io.github.ilyeshdz.yaplay</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Yaplay</string>
            <key>CFBundleDisplayName</key>
            <string>Yaplay</string>
            <key>CFBundleIconFile</key>
            <string>Yaplay.icns</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
          </dict>
          </plist>
          PLIST

          codesign --force --sign - "$APP"

          STAGE="dist/dmg-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Yaplay" -srcfolder "$STAGE" -ov -format UDZO \
            "dist/Yaplay-${{ matrix.target }}.dmg"
          rm -rf "$STAGE"

          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "dist/Yaplay-${{ matrix.target }}.app.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.app.zip
          if-no-files-found: error

  sign:
    name: Sign release assets
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: updater-release-tool
      - name: Install pinned update signing tool
        run: cargo install gpui-updater-release --version 0.4.4 --features cli --locked
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: yaplay-*
          path: dist
          merge-multiple: true
      - name: Sign update packages
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ vars.YAPLAY_UPDATE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gpui-updater-release sign minisign --version "$RELEASE_TAG" dist/*.exe dist/*.dmg
      - name: Generate asset checksums
        working-directory: dist
        run: sha256sum ./*.exe ./*.dmg ./*.app.zip > SHA256SUMS
      - name: Preserve signed assets for upload retries
        uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: dist/*
          if-no-files-found: error

  upload:
    name: Attach release assets
    needs: [verify, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: dist
      - name: Upload to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/publish-release.py --tag "$RELEASE_TAG" --dist dist --repo "$GITHUB_REPOSITORY"
      # Token-created releases do not trigger other workflows automatically.
      - name: Refresh release notes website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --ref master --repo "$GITHUB_REPOSITORY"
